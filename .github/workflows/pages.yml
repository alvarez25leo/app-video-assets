# Publica este repo en GitHub Pages: https://alvarez25leo.github.io/app-video-assets/
# (= LEARNING_ASSETS_BASE_URL del backend de App Video).
# Requisito único: Settings → Pages → Source = "GitHub Actions".
name: Publicar assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio (solo archivos publicables)
        run: |
          mkdir -p _site
          cp -R images audio manifest.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          echo "Archivos publicados: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
